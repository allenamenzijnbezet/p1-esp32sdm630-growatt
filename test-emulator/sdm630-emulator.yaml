esphome:
  name: sdm630-emulator
  friendly_name: sdm630-emulator
  includes:
    - sdm630-emulator.h
  # We gebruiken de 'on_loop' om continu de UART te checken
  on_loop:
    then:
      - lambda: |-
          process_modbus();

#esp32:
#  board: esp32-s3-devkitc-1
#  framework:
#    type: esp-idf

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "<<<<PASSWORD>>>>"

ota:
  - platform: esphome
    password: "<<<<PASSWORD>>>>"

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sdm630-Emulator Fallback Hotspot"
    password: "<<<<PASSWORD>>>>"

captive_portal:

uart:
  id: modbus_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1

#text_sensor:
#  - platform: template
#    name: "RS485 Raw Data"
#    id: raw_data_display
#    icon: "mdi:serial-port"

number:
  - platform: template
    name: "Handmatige Wattage"
    id: manual_wattage
    optimistic: true
    min_value: -5000
    max_value: 5000
    step: 10
    initial_value: 0
    restore_value: true
